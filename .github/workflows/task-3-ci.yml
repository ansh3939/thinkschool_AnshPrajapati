name: Day 3 Task 3 CI

on:
  push:
    paths:
      - "day-3/task-3/**"
      - ".github/workflows/task-3-ci.yml"
  pull_request:
    paths:
      - "day-3/task-3/**"
      - ".github/workflows/task-3-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore day-3/task-3/JwtAuth.sln

      - name: Build
        run: dotnet build day-3/task-3/JwtAuth.sln --no-restore

      - name: Test
        run: dotnet test day-3/task-3/JwtAuth.sln --no-build --verbosity normal
